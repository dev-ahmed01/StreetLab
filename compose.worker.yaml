# Optional inference process; requires REAL pinned W04 model and provenance.
services:
  worker:
    profiles: ["inference"]
    build:
      context: .
      target: worker
    image: streetlab:worker-local
    restart: unless-stopped
    init: true
    command: ["python","-m","streetlab_integration.worker",
              "--workdir","/app/.streetlab-m5",
              "--model-dir","/frozen/model",
              "--frozen-provenance","/frozen/provenance.json"]
    volumes:
      - streetlab_state:/app/.streetlab-m5
      - ./private/w04-model:/frozen/model:ro
      - ./private/w04-provenance.json:/frozen/provenance.json:ro
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
