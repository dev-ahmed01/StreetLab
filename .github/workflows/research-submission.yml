name: StreetLab Research Submission - No New Field Survey

on:
  push:
    branches: [main, codex/streetlab-research-submission]
  pull_request:
    paths:
      - "streetlab_integration/research_*"
      - "streetlab_phase2/api.py"
      - "streetlab_integration/workspace_ui.py"
      - "scripts/STREETLAB_RESEARCH.ps1"
      - "scripts/STREETLAB_M8.ps1"
      - "scripts/STREETLAB_W04_READINESS.ps1"
      - "scripts/STREETLAB_W04_SCORE_REPLAY.ps1"
      - "scripts/STREETLAB_W04_PREREGISTER.ps1"
      - "scripts/STREETLAB_W04_HOLDOUT_INTAKE.ps1"
      - "scripts/STREETLAB_W04_FIND_DATA.ps1"
      - "scripts/STREETLAB_W04_MAY25_REGRESSION.ps1"
      - "scripts/STREETLAB_W04_MAY25_FORENSICS.ps1"
      - "scripts/STREETLAB_W04_MAY25_REVIEW_PACKET.ps1"
      - "scripts/STREETLAB_W04_BLIND_REVIEW.ps1"
      - "scripts/STREETLAB_W04_AUTONOMOUS_RESEARCH.ps1"
      - "scripts/STREETLAB_W04_COMPLETION.ps1"
      - "streetlab_integration/w04_completion_gate.py"
      - "tests/test_w04_completion_gate.py"
      - "scripts/verify_submission_artifact.py"
      - "tests/test_submission_artifact_verifier.py"
      - "tests/test_w04_portable_drive_sources.py"
      - "streetlab_integration/w04_autonomous_diagnostics.py"
      - "tests/test_w04_autonomous_diagnostics.py"
      - "streetlab_integration/w04_blind_physical_review.py"
      - "tests/test_w04_blind_physical_review.py"
      - "streetlab_integration/w04_visual_review_packet.py"
      - "tests/test_w04_visual_review_packet.py"
      - "streetlab_integration/w04_crossdate_forensics.py"
      - "tests/test_w04_crossdate_forensics.py"
      - "streetlab_integration/w04_crossdate_regression.py"
      - "tests/test_w04_crossdate_regression.py"
      - "streetlab_integration/w04_dataset_inventory.py"
      - "tests/test_w04_dataset_inventory.py"
      - "streetlab_integration/w04_holdout_intake.py"
      - "tests/test_w04_holdout_intake.py"
      - "streetlab_integration/w04_preregistration.py"
      - "tests/test_w04_preregistration.py"
      - "tests/test_w04_score_replay.py"
      - "tests/test_w04_readiness.py"
      - "tests/test_research_submission.py"
      - "tests/test_research_audit_display.py"
      - "tests/test_research_page.py"
      - "tests/test_research_bundle_view.py"
      - "tests/test_research_release.py"
      - ".github/workflows/research-submission.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-evidence-and-real-native-sumo:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUMO_HOME: /usr/share/sumo
      STREETLAB_SECURITY_MODE: local
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            data/models
            data/raw/ChennaiTrajectoryData2.45-3.00PM.xlsx
            data/raw/ChennaiTrajectoryData3.00-3.15PM.xlsx
            data/processed/phase1_final_heldout_validation.json
            data/benchmarks/fluid_fidrt/manifest.json
            docs/PHASE3_W04_CONTINUOUS_201_FINAL_QA_20261009.md
            requirements.txt
            README_SUBMISSION.md
            research/MAY25_FULL_COHORT_REPLAY_2026-10-23.md
            scripts/phase2_m6_study_demo.py
            scripts/verify_submission_artifact.py
            streetlab_phase1
            streetlab_phase2
            streetlab_phase3
            streetlab_integration
            tests
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install actual SUMO engine and its Python TraCI interface
        run: |
          python -m pip install -r requirements.txt pytest opencv-python-headless traci sumolib "eclipse-sumo==1.28.0"
          SUMO_DIR="$(python -c 'import sumo; print(sumo.SUMO_HOME)')"
          test -x "$SUMO_DIR/bin/sumo"
          test -x "$SUMO_DIR/bin/netconvert"
          echo "SUMO_HOME=$SUMO_DIR" >> "$GITHUB_ENV"
          echo "$SUMO_DIR/bin" >> "$GITHUB_PATH"
          "$SUMO_DIR/bin/sumo" --version
          "$SUMO_DIR/bin/netconvert" --version
      - name: Compile source and verify syntax
        run: python -m compileall -q streetlab_integration streetlab_phase2
      - name: Import native study module without PYTHONPATH (Linux)
        run: |
          env -u PYTHONPATH python -m scripts.phase2_m6_study_demo --help > /dev/null
          python -W error::SyntaxWarning -m py_compile streetlab_integration/research_submission.py
      - name: Research scientific truthfulness and API regression
        run: |
          python -m pytest -q tests/test_research_submission.py tests/test_research_audit_display.py tests/test_research_page.py tests/test_research_release.py tests/test_research_bundle_view.py tests/test_submission_artifact_verifier.py tests/test_research_results.py tests/test_w04_readiness.py tests/test_w04_score_replay.py tests/test_w04_preregistration.py tests/test_w04_holdout_intake.py tests/test_w04_dataset_inventory.py tests/test_w04_crossdate_regression.py tests/test_w04_crossdate_forensics.py tests/test_w04_visual_review_packet.py tests/test_w04_blind_physical_review.py tests/test_w04_autonomous_diagnostics.py tests/test_w04_completion_gate.py tests/test_w04_portable_drive_sources.py tests/test_streetlab_integration_m9.py tests/test_phase2_m6_api.py
      - name: Real HTTP access to research page and fail-closed previous holdout
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from streetlab_phase2.api import create_app
          app=create_app()
          with TestClient(app) as c:
              page=c.get('/research')
              assert page.status_code==200
              assert 'research' in page.text.lower()
              value=c.get('/api/research/summary')
              assert value.status_code==200,value.text
              report=value.json()
              assert report['chennai']['holdout_generalization_pass'] is False
              assert report['fluid_w04']['scores_recomputed_in_this_run'] is False
              assert report['production_release_approved'] is False
              assert c.get('/api/research/may25-audit').status_code==409
              assert c.get('/api/projects').status_code==200
          print('Research API and existing project lifecycle: PASS')
          PY
      - name: Execute actual native SUMO and generate non-overwriting research submission
        run: |
          python -m streetlab_integration.research_submission --project-root . --output-dir artifacts/research_submission_ci --run-sumo
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/research_submission_ci')
          j=json.loads((p/'submission_evidence.json').read_text())
          assert j['research_workflow_status']=='RESEARCH_DEMO_EXECUTED_WITH_REPORTED_FAILED_REAL_WORLD_GENERALIZATION'
          assert j['native_sumo']['status']=='SUMO_EXECUTED_SYNTHETIC_ONLY'
          assert j['dataset_summaries']['chennai']['holdout_generalization_pass'] is False
          assert j['native_sumo']['production_release_approved'] is False
          assert j['production_release_approved'] is False
          assert (p/'native_sumo.log').is_file()
          assert (p/'native_sumo_study.json').is_file()
          assert (p/'research_results.md').is_file()
          assert (p/'research_metrics.csv').is_file()
          assert (p/'research_results_manifest.json').is_file()
          assert len(list(p.glob('figure_*.svg'))) == 5
          report=(p/'research_results.md').read_text()
          assert 'Trade-off' in report and 'not a confidence interval' in report
          assert 'Chennai held-out generalization **failed**' in report
          print('Actual SUMO research submission (not field validation): PASS')
          PY
      - name: Package bounded research prototype evidence ZIP with full SHA inventory
        run: |
          python -m streetlab_integration.research_release --run-dir artifacts/research_submission_ci --output artifacts/streetlab_research_bundle.zip
          python - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile
          archive=Path('artifacts/streetlab_research_bundle.zip')
          assert archive.is_file()
          with ZipFile(archive) as z:
              record=json.loads(z.read('manifest.json'))
              assert record['release_type']=='BOUNDED_RESEARCH_PROTOTYPE'
              assert record['native_sumo']=='SYNTHETIC_ONLY'
              assert record['chennai_holdout_generalization_pass'] is False
              assert record['may25_audit_status']=='NOT_INCLUDED_OR_NOT_VERIFIED'
              assert record['production_release_approved'] is False
          print('Source-bound bounded research release ZIP: PASS')
          PY
      - name: Verify checkout commit and create submission attestation
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from zipfile import ZipFile

          output = Path("artifacts")
          archive = output / "streetlab_research_bundle.zip"
          assert archive.is_file(), "Native research evidence archive missing"
          guide = Path("README_SUBMISSION.md")
          report = Path("research/MAY25_FULL_COHORT_REPLAY_2026-10-23.md")
          assert guide.is_file() and report.is_file()
          assert "canonical full-source audit still pending" in report.read_text(encoding="utf-8")
          assert "not" in guide.read_text(encoding="utf-8").lower()
          sha = os.environ["GITHUB_SHA"]
          assert len(sha) == 40 and all(c in "0123456789abcdef" for c in sha)
          with ZipFile(archive) as z:
              manifest = json.loads(z.read("manifest.json"))
              assert manifest["release_type"] == "BOUNDED_RESEARCH_PROTOTYPE"
              assert manifest["production_release_approved"] is False
              assert manifest["may25_audit_status"] == "NOT_INCLUDED_OR_NOT_VERIFIED"
          def digest(data):
              return hashlib.sha256(data).hexdigest()
          guide_bytes, report_bytes = guide.read_bytes(), report.read_bytes()
          (output / guide.name).write_bytes(guide_bytes)
          (output / report.name).write_bytes(report_bytes)
          receipt = {
              "schema_version": 1,
              "release_scope": "BOUNDED_RESEARCH_PROTOTYPE",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit_sha": sha,
              "git_ref": os.environ["GITHUB_REF"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "research_bundle_filename": archive.name,
              "research_bundle_sha256": digest(archive.read_bytes()),
              "submission_guide_sha256": digest(guide_bytes),
              "saved_cohort_replay_sha256": digest(report_bytes),
              "native_sumo_execution": "ACTUAL_ENGINE_SYNTHETIC_NETWORK_ONLY",
              "may25_original_video_rehashed_in_ci": False,
              "canonical_may25_full_source_audit_verified_in_ci": False,
              "chennai_holdout_generalization_pass": False,
              "independent_holdout_pass": False,
              "production_release_approved": False,
          }
          saved = output / "submission_build_receipt.json"
          saved.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          assert json.loads(saved.read_text())["commit_sha"] == sha
          print("Commit-bound submission artifact generated:", sha)
          PY
      - name: Independently verify downloaded research ZIP and its source commit
        run: |
          python scripts/verify_submission_artifact.py --directory artifacts --commit "$GITHUB_SHA"
          cp scripts/verify_submission_artifact.py artifacts/verify_submission_artifact.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: streetlab-research-demo-evidence
          path: |
            artifacts/research_submission_ci/submission_evidence.json
            artifacts/research_submission_ci/submission_summary.md
            artifacts/research_submission_ci/native_sumo_study.json
            artifacts/research_submission_ci/native_sumo.log
            artifacts/research_submission_ci/research_results.md
            artifacts/research_submission_ci/research_metrics.csv
            artifacts/research_submission_ci/research_results_manifest.json
            artifacts/research_submission_ci/figure_*.svg
            artifacts/streetlab_research_bundle.zip
            artifacts/submission_build_receipt.json
            artifacts/verify_submission_artifact.py
            artifacts/README_SUBMISSION.md
            artifacts/MAY25_FULL_COHORT_REPLAY_2026-10-23.md
            artifacts/research_submission_ci/FAILED_RESEARCH_RUN.txt
          if-no-files-found: warn
      - name: Preserve public portable audit implementation for offline source-verified replay
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: streetlab-canonical-audit-runtime
          path: |
            streetlab_integration/
            streetlab_phase3/
            streetlab_phase2/
            streetlab_phase1/
            scripts/
            requirements.txt
          if-no-files-found: error

  windows-powershell-syntax:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/STREETLAB_M8.ps1
            scripts/STREETLAB_RESEARCH.ps1
            scripts/STREETLAB_W04_READINESS.ps1
            scripts/STREETLAB_W04_SCORE_REPLAY.ps1
            scripts/STREETLAB_W04_PREREGISTER.ps1
            scripts/STREETLAB_W04_HOLDOUT_INTAKE.ps1
            scripts/STREETLAB_W04_FIND_DATA.ps1
            scripts/STREETLAB_W04_MAY25_REGRESSION.ps1
            scripts/STREETLAB_W04_MAY25_FORENSICS.ps1
            scripts/STREETLAB_W04_MAY25_REVIEW_PACKET.ps1
            scripts/STREETLAB_W04_BLIND_REVIEW.ps1
            scripts/STREETLAB_W04_AUTONOMOUS_RESEARCH.ps1
            scripts/STREETLAB_W04_COMPLETION.ps1
            scripts/phase2_m6_study_demo.py
            streetlab_phase2
          sparse-checkout-cone-mode: false
      - name: Parse research and port-aware local launcher
        shell: pwsh
        run: |
          foreach ($script in @('scripts/STREETLAB_M8.ps1','scripts/STREETLAB_RESEARCH.ps1','scripts/STREETLAB_W04_READINESS.ps1','scripts/STREETLAB_W04_SCORE_REPLAY.ps1','scripts/STREETLAB_W04_PREREGISTER.ps1','scripts/STREETLAB_W04_HOLDOUT_INTAKE.ps1','scripts/STREETLAB_W04_FIND_DATA.ps1','scripts/STREETLAB_W04_MAY25_REGRESSION.ps1','scripts/STREETLAB_W04_MAY25_FORENSICS.ps1','scripts/STREETLAB_W04_MAY25_REVIEW_PACKET.ps1','scripts/STREETLAB_W04_BLIND_REVIEW.ps1','scripts/STREETLAB_W04_AUTONOMOUS_RESEARCH.ps1','scripts/STREETLAB_W04_COMPLETION.ps1')) {
            $tokens=$null
            $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $script),[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {throw "PowerShell parser failed for $script"}
          }
          Write-Host 'Windows launch scripts: PASS'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify native module import without PYTHONPATH (Windows)
        shell: pwsh
        run: |
          python -m pip install "fastapi>=0.115" "httpx>=0.27"
          if ($LASTEXITCODE -ne 0) {throw 'Dependency setup failed'}
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          python -m scripts.phase2_m6_study_demo --help
          if ($LASTEXITCODE -ne 0) {throw 'Native module import from repository root failed'}
