name: StreetLab Research Submission - No New Field Survey

on:
  push:
    branches: [codex/streetlab-research-submission]
  pull_request:
    paths:
      - "streetlab_integration/research_*"
      - "streetlab_phase2/api.py"
      - "streetlab_integration/workspace_ui.py"
      - "scripts/STREETLAB_RESEARCH.ps1"
      - "scripts/STREETLAB_M8.ps1"
      - "tests/test_research_submission.py"
      - ".github/workflows/research-submission.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-evidence-and-real-native-sumo:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUMO_HOME: /usr/share/sumo
      STREETLAB_SECURITY_MODE: local
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            data/models
            data/raw/ChennaiTrajectoryData2.45-3.00PM.xlsx
            data/raw/ChennaiTrajectoryData3.00-3.15PM.xlsx
            data/processed/phase1_final_heldout_validation.json
            data/benchmarks/fluid_fidrt/manifest.json
            docs/PHASE3_W04_CONTINUOUS_201_FINAL_QA_20261009.md
            requirements.txt
            scripts/phase2_m6_study_demo.py
            streetlab_phase1
            streetlab_phase2
            streetlab_phase3
            streetlab_integration
            tests
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install actual SUMO engine and its Python TraCI interface
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sumo
          python -m pip install -r requirements.txt pytest opencv-python-headless traci sumolib
          sumo --version
          netconvert --version
      - name: Compile source and verify syntax
        run: python -m compileall -q streetlab_integration streetlab_phase2
      - name: Import native study module without PYTHONPATH (Linux)
        run: |
          env -u PYTHONPATH python -m scripts.phase2_m6_study_demo --help > /dev/null
          python -W error::SyntaxWarning -m py_compile streetlab_integration/research_submission.py
      - name: Research scientific truthfulness and API regression
        run: |
          python -m pytest -q tests/test_research_submission.py tests/test_research_results.py tests/test_streetlab_integration_m9.py tests/test_phase2_m6_api.py
      - name: Real HTTP access to research page and fail-closed previous holdout
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from streetlab_phase2.api import create_app
          app=create_app()
          with TestClient(app) as c:
              page=c.get('/research')
              assert page.status_code==200
              assert 'research' in page.text.lower()
              value=c.get('/api/research/summary')
              assert value.status_code==200,value.text
              report=value.json()
              assert report['chennai']['holdout_generalization_pass'] is False
              assert report['fluid_w04']['scores_recomputed_in_this_run'] is False
              assert report['production_release_approved'] is False
              assert c.get('/api/projects').status_code==200
          print('Research API and existing project lifecycle: PASS')
          PY
      - name: Execute actual native SUMO and generate non-overwriting research submission
        run: |
          python -m streetlab_integration.research_submission --project-root . --output-dir artifacts/research_submission_ci --run-sumo
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/research_submission_ci')
          j=json.loads((p/'submission_evidence.json').read_text())
          assert j['research_workflow_status']=='RESEARCH_DEMO_EXECUTED_WITH_REPORTED_FAILED_REAL_WORLD_GENERALIZATION'
          assert j['native_sumo']['status']=='SUMO_EXECUTED_SYNTHETIC_ONLY'
          assert j['dataset_summaries']['chennai']['holdout_generalization_pass'] is False
          assert j['native_sumo']['production_release_approved'] is False
          assert j['production_release_approved'] is False
          assert (p/'native_sumo.log').is_file()
          assert (p/'native_sumo_study.json').is_file()
          assert (p/'research_results.md').is_file()
          assert (p/'research_metrics.csv').is_file()
          assert (p/'research_results_manifest.json').is_file()
          assert len(list(p.glob('figure_*.svg'))) == 5
          report=(p/'research_results.md').read_text()
          assert 'Trade-off' in report and 'not a confidence interval' in report
          assert 'Chennai held-out generalization **failed**' in report
          print('Actual SUMO research submission (not field validation): PASS')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: streetlab-research-demo-evidence
          path: |
            artifacts/research_submission_ci/submission_evidence.json
            artifacts/research_submission_ci/submission_summary.md
            artifacts/research_submission_ci/native_sumo_study.json
            artifacts/research_submission_ci/native_sumo.log
            artifacts/research_submission_ci/research_results.md
            artifacts/research_submission_ci/research_metrics.csv
            artifacts/research_submission_ci/research_results_manifest.json
            artifacts/research_submission_ci/figure_*.svg
            artifacts/research_submission_ci/FAILED_RESEARCH_RUN.txt
          if-no-files-found: warn

  windows-powershell-syntax:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/STREETLAB_M8.ps1
            scripts/STREETLAB_RESEARCH.ps1
            scripts/phase2_m6_study_demo.py
            streetlab_phase2
          sparse-checkout-cone-mode: false
      - name: Parse research and port-aware local launcher
        shell: pwsh
        run: |
          foreach ($script in @('scripts/STREETLAB_M8.ps1','scripts/STREETLAB_RESEARCH.ps1')) {
            $tokens=$null
            $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $script),[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {throw "PowerShell parser failed for $script"}
          }
          Write-Host 'Windows launch scripts: PASS'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify native module import without PYTHONPATH (Windows)
        shell: pwsh
        run: |
          python -m pip install "fastapi>=0.115" "httpx>=0.27"
          if ($LASTEXITCODE -ne 0) {throw 'Dependency setup failed'}
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          python -m scripts.phase2_m6_study_demo --help
          if ($LASTEXITCODE -ne 0) {throw 'Native module import from repository root failed'}
