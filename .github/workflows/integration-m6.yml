name: StreetLab Integration M6 - Unified Workspace

on:
  push:
    branches: [codex/streetlab-integration-m6]
  pull_request:
    paths:
      - "streetlab_integration/**"
      - "streetlab_phase2/api.py"
      - "tests/test_streetlab_integration_m6.py"
      - ".github/workflows/integration-m6.yml"

jobs:
  project-workspace-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            streetlab_integration
            streetlab_phase1
            streetlab_phase2
            streetlab_phase3
            scripts/streetlab_integration_m1.py
            tests/test_streetlab_integration_m1.py
            tests/test_streetlab_integration_m2.py
            tests/test_streetlab_integration_m3.py
            tests/test_streetlab_integration_m4.py
            tests/test_streetlab_integration_m5.py
            tests/test_streetlab_integration_m6.py
            tests/test_phase2_m6_api.py
            requirements.txt
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTTP and source-evidence testing requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest opencv-python-headless
      - name: Compile integration and inspect JavaScript syntax
        run: |
          python -m compileall -q streetlab_integration streetlab_phase2
          node --check streetlab_integration/assets/workspace.js
      - name: M1-M6 full regression including project isolation and homepage integration
        env:
          PYTHONPATH: .
        run: |
          pytest -q tests/test_streetlab_integration_m1.py tests/test_streetlab_integration_m2.py tests/test_streetlab_integration_m3.py tests/test_streetlab_integration_m4.py tests/test_streetlab_integration_m5.py tests/test_streetlab_integration_m6.py tests/test_phase2_m6_api.py