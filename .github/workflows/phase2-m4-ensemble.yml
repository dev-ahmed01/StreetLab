name: Phase 2 Scenario Ensembles M4

on:
  push:
    branches:
      - "phase2/**"
  pull_request:
    paths:
      - "streetlab_phase1/**"
      - "streetlab_phase2/**"
      - "scripts/phase2_m4_ensemble_demo.py"
      - "tests/**"
      - ".github/workflows/phase2-m4-ensemble.yml"

jobs:
  ensemble-m4:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            streetlab_phase1
            streetlab_phase2
            streetlab_phase3
            scripts/phase3_setup_geotrax_windows.ps1
            scripts/phase3_run_geotrax_windows.ps1
            scripts/phase3_compare_geotrax_fluid.py
            scripts/phase3_identity_benchmark.py
            scripts/phase3_recall_loss_diagnosis.py
            scripts/phase3_motorcycle_visual_audit.py
            scripts/phase3_engine_shootout.py
            scripts/phase3_class_diagnostics.py
            scripts/phase3_compare_existing_trials.py
            scripts/phase3_visual_error_review.py
            scripts/phase2_m4_ensemble_demo.py
            tests
            data/models/sumo_persona_priors.csv
            requirements.txt
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run full repository test suite
        run: |
          export PYTHONPATH="$PWD"
          pytest -q

      - name: Install SUMO
        run: |
          sudo apt-get update
          sudo apt-get install -y sumo sumo-tools
          echo "SUMO_HOME=/usr/share/sumo" >> "$GITHUB_ENV"

      - name: Run M4 scenario ensemble integration
        run: |
          export PYTHONPATH="$PWD"
          export PATH="/usr/bin:$PATH"
          python scripts/phase2_m4_ensemble_demo.py --members 4 --output artifacts/phase2_m4_ensemble.json --workdir .streetlab-m4

      - name: Validate M4 decision-assurance artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("artifacts/phase2_m4_ensemble.json")
          assert p.exists(), "M4 ensemble artifact was not produced"
          r = json.loads(p.read_text())

          assert r["milestone"] == "PHASE2_M4_SCENARIO_ENSEMBLES"
          g = r["guardrails"]
          assert g["phase1_retuned"] is False
          assert g["microscopic_parameters_varied"] is False
          assert g["routing_behavior_empirically_learned"] is False
          assert g["uncertainty_is_probability_forecast"] is False
          assert g["authority_remains_final_decision_maker"] is True

          ensemble = r["ensemble"]
          meta = ensemble["ensemble"]
          assert meta["members"] == 4
          assert meta["uncertainty_source"] == "ASSUMPTION_ASSIGNMENT"
          assert meta["provenance"] == "ASSUMED"
          assert meta["same_snapshot_for_all_members"] is True
          assert len(ensemble["member_runs"]) == 4

          snapshot_hashes = {
              member["snapshot"]["sha256"]
              for member in ensemble["member_runs"]
          }
          assert snapshot_hashes == {r["snapshot"]["sha256"]}

          member_seeds = [m["member_seed"] for m in ensemble["member_runs"]]
          assert len(set(member_seeds)) == 4

          summaries = ensemble["branch_summaries"]
          assert set(summaries) == {
              "BASELINE",
              "NATURAL_RESPONSE",
              "GUIDED_DIVERSION",
              "MIXED_RESPONSE",
          }
          for branch in summaries.values():
              for metric in (
                  "arrivals_after_decision",
                  "max_approach_queue_vehicles",
                  "mean_network_speed_mps",
                  "mean_instant_waiting_time_s",
                  "rerouted_vehicles",
              ):
                  stats = branch["metrics"][metric]
                  assert set(stats) == {
                      "min", "mean", "median", "p10", "p90", "max", "spread"
                  }
                  assert stats["min"] <= stats["p10"] <= stats["median"]
                  assert stats["median"] <= stats["p90"] <= stats["max"]
                  assert stats["spread"] >= 0

          mixed = summaries["MIXED_RESPONSE"]["metrics"]
          assert mixed["heterogeneous_guided_responders"]["min"] > 0
          assert mixed["heterogeneous_local_responders"]["min"] > 0

          assert summaries["BASELINE"]["metrics"][
              "max_approach_queue_vehicles"
          ]["spread"] == 0

          print(json.dumps({
              "ensemble": meta,
              "mixed_queue": mixed["max_approach_queue_vehicles"],
              "mixed_speed": mixed["mean_network_speed_mps"],
              "mixed_guided": mixed["heterogeneous_guided_responders"],
              "mixed_local": mixed["heterogeneous_local_responders"],
          }, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: phase2-m4-ensemble
          path: artifacts/phase2_m4_ensemble.json
