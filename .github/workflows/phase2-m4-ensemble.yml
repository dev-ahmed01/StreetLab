name: Phase 2 Scenario Ensembles M4

on:
  push:
    branches:
      - "phase2/**"
  pull_request:
    paths:
      - "streetlab_phase2/**"
      - "scripts/phase2_m4_ensemble_demo.py"
      - "tests/test_phase2_ensemble.py"
      - ".github/workflows/phase2-m4-ensemble.yml"

jobs:
  ensemble-m4:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            streetlab_phase2
            tests/test_phase2_ensemble.py
            tests/test_phase2_runtime.py
            tests/test_phase2_decision_lab.py
            data/models/sumo_persona_priors.csv
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: pip install pytest

      - name: Run M4 ensemble contract tests
        run: |
          export PYTHONPATH="$PWD"
          pytest -q tests/test_phase2_ensemble.py
