name: StreetLab Consolidation - Clean Checkout and HTTP Acceptance

on:
  push:
    branches: [codex/streetlab-repo-consolidation, main]
  pull_request:
    branches: [codex/streetlab-integration-m9, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-repository-and-http:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            .github
            .gitignore
            requirements.txt
            scripts
            streetlab_integration
            streetlab_phase1
            streetlab_phase2
            streetlab_phase3
            tests
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate tracked-file hygiene before installation
        run: python scripts/repository_hygiene.py --root .
      - name: Install from declared requirements (no tracked virtualenv)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest opencv-python-headless
      - name: Compile source and validate workspace frontend
        run: |
          python -m compileall -q streetlab_integration streetlab_phase1 streetlab_phase2 streetlab_phase3
          node --check streetlab_integration/assets/workspace.js
      - name: Run M1-M9 integration, local guard, data integrity, and API tests
        env:
          PYTHONPATH: .
          STREETLAB_SECURITY_MODE: local
        run: |
          pytest -q \
            tests/test_streetlab_integration_m1.py \
            tests/test_streetlab_integration_m2.py \
            tests/test_streetlab_integration_m3.py \
            tests/test_streetlab_integration_m4.py \
            tests/test_streetlab_integration_m5.py \
            tests/test_streetlab_integration_m6.py \
            tests/test_streetlab_integration_m7.py \
            tests/test_streetlab_integration_m8.py \
            tests/test_streetlab_integration_m9.py \
            tests/test_phase2_m6_api.py
      - name: Run real localhost Uvicorn HTTP lifecycle and security smoke
        run: python scripts/repository_smoke.py

  windows-launcher-and-clean-source:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            .gitignore
            scripts
          sparse-checkout-cone-mode: true
      - name: Confirm tracked Windows venv is absent and PowerShell launchers parse
        shell: pwsh
        run: |
          if (Test-Path .venv) { throw "Committed Windows virtualenv is still present" }
          if (git ls-files | Select-String '^(?:\.venv/|.*__pycache__/|.*\.pyc$)') {
            throw "Generated Python runtime files are tracked"
          }
          foreach ($script in @('scripts/STREETLAB_M8.ps1','scripts/STREETLAB_M9.ps1','scripts/STREETLAB_DOCKER.ps1')) {
            $t=$null
            $e=$null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $script), [ref]$t,[ref]$e) | Out-Null
            if ($e.Count -gt 0) {throw "Malformed PowerShell launcher: $script"}
          }
          & ./scripts/STREETLAB_DOCKER.ps1 -Mode Initialize
          $line = (Get-Content .env | Where-Object { $_ -like 'STREETLAB_ACCESS_PASSWORD=*' })
          if (-not $line -or $line.Split('=',2)[1].Length -lt 40 -or $line -match 'REPLACE_WITH_') {
            throw 'Generated local password is not cryptographically strong'
          }
          Remove-Item .env -Force
          Write-Host 'Clean Windows launcher parsers and secure bootstrap passed'
