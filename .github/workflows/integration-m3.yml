name: StreetLab Integration M3 - Spatial Reconstruction

on:
  push:
    branches: [codex/streetlab-integration-m3]
  pull_request:
    paths:
      - "streetlab_integration/**"
      - "streetlab_phase2/api.py"
      - "tests/test_streetlab_integration_m3.py"
      - ".github/workflows/integration-m3.yml"

jobs:
  metric-evidence-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            streetlab_integration
            streetlab_phase1
            streetlab_phase2
            streetlab_phase3
            scripts/streetlab_integration_m1.py
            tests/test_streetlab_integration_m1.py
            tests/test_streetlab_integration_m2.py
            tests/test_streetlab_integration_m3.py
            tests/test_phase2_m6_api.py
            requirements.txt
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis contracts and image-decoder dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest opencv-python-headless
      - name: Python syntax and import smoke
        run: python -m compileall -q streetlab_integration streetlab_phase2
      - name: M1 M2 M3 regression and guarded synthetic Decision Lab
        env:
          PYTHONPATH: .
        run: |
          pytest -q tests/test_streetlab_integration_m1.py tests/test_streetlab_integration_m2.py tests/test_streetlab_integration_m3.py tests/test_phase2_m6_api.py
