name: StreetLab Integration M5 - Paired Site Scenarios

on:
  push:
    branches: [codex/streetlab-integration-m5]
  pull_request:
    paths:
      - "streetlab_integration/**"
      - "streetlab_phase2/api.py"
      - "tests/test_streetlab_integration_m5.py"
      - ".github/workflows/integration-m5.yml"

jobs:
  scenario-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            streetlab_integration
            streetlab_phase1
            streetlab_phase2
            streetlab_phase3
            scripts/streetlab_integration_m1.py
            tests/test_streetlab_integration_m1.py
            tests/test_streetlab_integration_m2.py
            tests/test_streetlab_integration_m3.py
            tests/test_streetlab_integration_m4.py
            tests/test_streetlab_integration_m5.py
            tests/test_phase2_m6_api.py
            requirements.txt
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application contract dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest opencv-python-headless
      - name: Compile StreetLab integration and Phase 2
        run: python -m compileall -q streetlab_integration streetlab_phase2
      - name: Run M1-M5 software regression tests without native simulator
        env:
          PYTHONPATH: .
        run: |
          pytest -q tests/test_streetlab_integration_m1.py tests/test_streetlab_integration_m2.py tests/test_streetlab_integration_m3.py tests/test_streetlab_integration_m4.py tests/test_streetlab_integration_m5.py tests/test_phase2_m6_api.py
      - name: Install actual SUMO/netconvert
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sumo
          sumo --version
          netconvert --version
      - name: Run native SUMO M4 and M5 integration with clearly synthetic fixtures
        env:
          PYTHONPATH: .
        run: |
          pytest -q tests/test_streetlab_integration_m4.py -k actual_sumo_cli_compiles
          pytest -q tests/test_streetlab_integration_m5.py -k real_sumo_paired_experiment_synthetic_fixture