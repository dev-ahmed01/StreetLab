name: StreetLab Integration M2 - Local Video Jobs

on:
  push:
    branches: [codex/streetlab-integration-m2]
  pull_request:
    paths:
      - "streetlab_integration/**"
      - "streetlab_phase2/api.py"
      - "tests/test_streetlab_integration_m2.py"
      - ".github/workflows/integration-m2.yml"
      - "README_INTEGRATION_M2.md"

jobs:
  local-video-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            streetlab_integration
            streetlab_phase1
            streetlab_phase2
            streetlab_phase3
            tests/test_streetlab_integration_m1.py
            tests/test_streetlab_integration_m2.py
            scripts/streetlab_integration_m1.py
            requirements.txt
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install local integration test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest opencv-python-headless
      - name: Compile touched packages
        run: python -m compileall -q streetlab_integration streetlab_phase2
      - name: Verify persistent jobs, existing receipts, HTTP and decoder contracts
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_streetlab_integration_m1.py tests/test_streetlab_integration_m2.py
      - name: Verify operator worker CLI
        run: python -m streetlab_integration.worker --help
