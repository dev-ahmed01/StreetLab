name: StreetLab - Verified Historical Branch Retirement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retire-merged-branches.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-main-clean-and-http:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            .github
            scripts
            tests
            streetlab_integration
            streetlab_phase1
            streetlab_phase2
            streetlab_phase3
            requirements.txt
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install clean application requirements and test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest opencv-python-headless
      - name: Verify branch deletion safety controls and source hygiene
        env:
          PYTHONPATH: .
        run: |
          python scripts/repository_hygiene.py
          python -m pytest -q tests/test_branch_retirement.py
      - name: Rerun all M1-M9 integration tests
        env:
          PYTHONPATH: .
          STREETLAB_SECURITY_MODE: local
        run: |
          python -m pytest -q tests/test_streetlab_integration_m1.py tests/test_streetlab_integration_m2.py tests/test_streetlab_integration_m3.py tests/test_streetlab_integration_m4.py tests/test_streetlab_integration_m5.py tests/test_streetlab_integration_m6.py tests/test_streetlab_integration_m7.py tests/test_streetlab_integration_m8.py tests/test_streetlab_integration_m9.py tests/test_phase2_m6_api.py
      - name: Actual Uvicorn localhost and HTTP security smoke
        env:
          PYTHONPATH: .
          STREETLAB_SECURITY_MODE: local
        run: python scripts/repository_smoke.py

  delete-only-verified-absorbed-refs:
    needs: verify-main-clean-and-http
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    if: github.repository == 'dev-ahmed01/StreetLab' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: true
      - name: Verify branch ancestry, commit SHA, protection and delete only exact allowlisted refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/retire_merged_branches.py --apply
