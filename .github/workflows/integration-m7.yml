name: StreetLab Integration M7 - Provenance Reports and Security

on:
  push:
    branches: [codex/streetlab-integration-m7]
  pull_request:
    paths:
      - "streetlab_integration/**"
      - "streetlab_phase2/api.py"
      - "tests/test_streetlab_integration_m7.py"
      - ".github/workflows/integration-m7.yml"

jobs:
  report-and-security-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            streetlab_integration
            streetlab_phase1
            streetlab_phase2
            streetlab_phase3
            scripts/streetlab_integration_m1.py
            tests/test_streetlab_integration_m1.py
            tests/test_streetlab_integration_m2.py
            tests/test_streetlab_integration_m3.py
            tests/test_streetlab_integration_m4.py
            tests/test_streetlab_integration_m5.py
            tests/test_streetlab_integration_m6.py
            tests/test_streetlab_integration_m7.py
            tests/test_phase2_m6_api.py
            requirements.txt
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application and test requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest opencv-python-headless
      - name: Compile Python and check workspace browser asset
        run: |
          python -m compileall -q streetlab_integration streetlab_phase2
          node --check streetlab_integration/assets/workspace.js
      - name: Run M1-M7 evidence, reporting, security, and Phase 2 compatibility acceptance
        env:
          PYTHONPATH: .
          STREETLAB_SECURITY_MODE: local
        run: |
          pytest -q tests/test_streetlab_integration_m1.py tests/test_streetlab_integration_m2.py tests/test_streetlab_integration_m3.py tests/test_streetlab_integration_m4.py tests/test_streetlab_integration_m5.py tests/test_streetlab_integration_m6.py tests/test_streetlab_integration_m7.py tests/test_phase2_m6_api.py